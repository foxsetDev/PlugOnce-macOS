<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlugOnce · Motion cover</title>
<style>
/* Colors match the public PlugOnce website. */
:root {
  --paper: #f2f5f7;
  --ink: #20252b;
  --accent: #286ac8;
  --media: #e8edf2;
  --image-outline: rgba(0, 0, 0, .1);
  --shadow-surface: 0 0 0 1px rgba(0, 0, 0, .07), 0 2px 4px rgba(28, 37, 54, .025), 0 16px 34px rgba(28, 37, 54, .045);
}
:root[data-theme="dark"] {
  --paper: #15181d;
  --ink: #edf1f7;
  --accent: #a9caff;
  --media: #243344;
  --image-outline: rgba(255, 255, 255, .1);
  --shadow-surface: 0 0 0 1px rgba(255, 255, 255, .1), 0 2px 4px rgba(0, 0, 0, .12), 0 16px 34px rgba(0, 0, 0, .14);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0 auto auto 0; width: 1600px; height: 760px; overflow: hidden; transform-origin: top left; background: var(--paper); color: var(--ink); }
.brand { position: absolute; top: 48px; left: 65px; display: flex; align-items: center; gap: 16px; }
.brand img { width: 76px; height: 76px; }
.brand strong { font-size: 38px; letter-spacing: -1.7px; font-weight: 650; }
h1 { position: absolute; left: 72px; top: 274px; margin: 0; font-size: 87px; font-weight: 630; letter-spacing: -4.8px; line-height: 1.065; }
h1 span { color: var(--accent); }
.window { position: absolute; left: 642px; top: 206px; width: 894px; height: 470px; border-radius: 22px; background: var(--media); overflow: hidden; box-shadow: var(--shadow-surface); outline: 1px solid var(--image-outline); }
.window video { position: absolute; left: -2.63158%; top: -19.16667%; width: 105.26316%; height: 125%; object-fit: fill; opacity: 0; }
.window video:first-child { opacity: 1; }
.window:after { content: ""; position: absolute; inset: 0; border-radius: 22px; box-shadow: inset 0 0 0 1px #ffffff14; pointer-events: none; }
</style>
<div id="stage">
  <div class="brand"><img src="../assets/icon.png" alt=""><strong>PlugOnce</strong></div>
  <h1 id="title">Connect.<br>See.<br><span>Move.</span></h1>
  <div class="window">
    <video src="../media/files.mp4" muted playsinline preload="auto"></video>
    <video src="../media/captures.mp4" muted playsinline preload="auto"></video>
    <video src="../media/saves.mp4" muted playsinline preload="auto"></video>
  </div>
</div>
<script>

const params=new URLSearchParams(location.search);
document.documentElement.dataset.theme=params.get('theme')==='dark'?'dark':'light';
const ru=params.get('lang')==='ru';
document.documentElement.lang=ru?'ru':'en';
if(ru){document.getElementById('title').innerHTML='Подключил.<br>Увидел.<br><span>Перенёс.</span>';document.getElementById('title').style.fontSize='77px';document.getElementById('title').style.letterSpacing='-4px';}
const videos=[...document.querySelectorAll('video')];
const ease=x=>x*x*(3-2*x);
function seek(video,time){return new Promise((resolve,reject)=>{if(Math.abs(video.currentTime-time)<.001&&video.readyState>=2){resolve();return;}video.addEventListener('seeked',resolve,{once:true});video.addEventListener('error',reject,{once:true});video.currentTime=time;});}
window.renderAt=async function(t){
  t=((t%12)+12)%12;
  const current=Math.floor(t/4),local=t%4,next=(current+1)%3;
  const progress=ease(Math.max(0,Math.min(1,(local-3.3)/.7)));
  await Promise.all([seek(videos[current],2+local*.72),seek(videos[next],2)]);
  videos.forEach((video,i)=>video.style.opacity=i===current?1-progress:i===next?progress:0);
};
function resize(){document.getElementById('stage').style.transform=`scale(${Math.min(innerWidth/1600,innerHeight/760)})`;}
addEventListener('resize',resize);resize();
window.ready=Promise.all(videos.map(v=>v.readyState>=1?Promise.resolve():new Promise((resolve,reject)=>{v.addEventListener('loadedmetadata',resolve,{once:true});v.addEventListener('error',reject,{once:true});}))).then(()=>window.renderAt(0));
if(params.get('capture')!=='1'){window.ready.then(()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const start=performance.now();async function tick(){await window.renderAt((performance.now()-start)/1000);requestAnimationFrame(tick);}requestAnimationFrame(tick);});}
</script>
</html>
